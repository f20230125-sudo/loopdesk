name: Application checks
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/manage.py test
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loopdesk_ci
          POSTGRES_PASSWORD: ephemeral_test_only
          POSTGRES_DB: loopdesk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loopdesk_ci -d loopdesk_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOOPDESK_TEST_DATABASE_URL: postgresql://loopdesk_ci:ephemeral_test_only@localhost:5432/loopdesk_ci
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-dev.txt
      - run: .venv/bin/python scripts/manage.py test-postgres
